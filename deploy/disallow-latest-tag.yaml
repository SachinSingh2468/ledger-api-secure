apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
spec:
  validationFailureAction: Enforce
  background: true

  rules:
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds:
                - Pod

      validate:
        message: "Using the ':latest' image tag is not allowed. Use an immutable version tag or image digest."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
